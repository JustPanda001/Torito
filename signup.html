<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Torito</title>
<link rel="icon" href="assets/torito-logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://zwmmgrrrryxaulrcuudy.supabase.co" crossorigin>
<script>document.documentElement.classList.add('js');</script>
</head>
<body class="auth-body">

<main class="auth-page">
  <div class="auth-card">

    <a class="auth-logo" href="index.html">
      <img src="assets/torito-logo.png" alt="Torito — Georgian Ascent Tours">
      <span>TORITO</span>
    </a>

    <h1>Create your account</h1>

    <form class="auth-form" id="signupForm" novalidate>
      <label class="field">
        <span class="field-label">Full name</span>
        <input type="text" name="name" autocomplete="name" required>
      </label>

      <label class="field">
        <span class="field-label">Email address</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
        <span class="field-hint">At least 8 characters</span>
      </label>

      <label class="field">
        <span class="field-label">Confirm password</span>
        <input type="password" name="confirm" autocomplete="new-password" required>
      </label>

      <label class="check">
        <input type="checkbox" name="terms" required>
        <span>I agree to the <a class="auth-link" href="#">terms</a> and <a class="auth-link" href="#">privacy policy</a></span>
      </label>

      <button class="auth-btn" type="submit">Create account</button>

      <p class="form-note" id="signupNote" hidden></p>
    </form>

    <div class="auth-or"><span>OR</span></div>

    <button class="auth-btn google" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.5z"/>
        <path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A12 12 0 0 0 12 24z"/>
        <path fill="#FBBC05" d="M5.6 14.7a7.2 7.2 0 0 1 0-4.6v-3H1.8a12 12 0 0 0 0 10.6l3.8-3z"/>
        <path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3A11.6 11.6 0 0 0 12 0 12 12 0 0 0 1.8 6.1l3.8 3C6.5 6.7 9 4.8 12 4.8z"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-foot">Already have an account? <a class="auth-link" href="login.html">Sign in</a></p>
  </div>
</main>

<script type="module" src="js/auth.js"></script>
</body>
</html>
