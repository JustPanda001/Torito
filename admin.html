<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Torito</title>
<link rel="icon" href="assets/torito-logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://zwmmgrrrryxaulrcuudy.supabase.co" crossorigin>
<script>document.documentElement.classList.add('js');</script>
</head>
<body class="subpage">

<header class="site-header solid" id="siteHeader">
  <div class="header-inner">
    <div class="header-left">
      <a class="logo" href="index.html">
        <img src="assets/torito-logo.png" alt="Torito — Georgian Ascent Tours">
        <span class="logo-text">TORITO</span>
      </a>
      <span class="admin-tag">ADMIN</span>
    </div>
    <div class="header-actions">
      <a class="icon-btn" href="tours.html">View site</a>
      <a class="icon-btn" href="login.html" title="Log in">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
        <span class="hide-sm">Log in</span>
      </a>
    </div>
  </div>
</header>

<main class="detail-page" id="adminMain" hidden>

  <div class="listing-head">
    <h1>Manage tours</h1>
    <p class="listing-count" id="adminCount"></p>
  </div>

  <!-- ---------- add a tour ---------- -->
  <section class="detail-block">
    <h2 id="formTitle">Add a tour</h2>

    <form class="admin-form" id="tourForm">
      <div class="admin-grid">
        <label class="field"><span class="field-label">Title *</span>
          <input name="title" required placeholder="Mestia – Ushguli Trek"></label>

        <label class="field"><span class="field-label">URL slug *</span>
          <input name="slug" required placeholder="mestia-ushguli-trek">
          <span class="field-hint">Lowercase, dashes instead of spaces</span></label>

        <label class="field"><span class="field-label">Subtitle</span>
          <input name="subtitle" placeholder="4 days"></label>

        <label class="field"><span class="field-label">Category *</span>
          <select name="category" required>
            <option value="hiking">Hiking</option>
            <option value="camping">Camping</option>
            <option value="ski">Ski &amp; snowboard</option>
            <option value="culture">Culture</option>
            <option value="other">Other</option>
          </select></label>

        <label class="field"><span class="field-label">Region</span>
          <input name="region" placeholder="Svaneti"></label>

        <label class="field"><span class="field-label">Cover image</span>
          <input name="cover_image" placeholder="assets/svaneti.jpg"></label>

        <label class="field"><span class="field-label">Distance</span>
          <input name="distance" placeholder="58 km"></label>

        <label class="field"><span class="field-label">Duration</span>
          <input name="duration" placeholder="4 days"></label>

        <label class="field"><span class="field-label">Difficulty</span>
          <input name="difficulty" placeholder="Moderate"></label>

        <label class="field"><span class="field-label">Capacity *</span>
          <input name="capacity" type="number" min="1" value="10" required></label>

        <label class="field"><span class="field-label">Spots left</span>
          <input name="spots_left" type="number" min="0" placeholder="5"></label>

        <label class="field"><span class="field-label">Elevation gain</span>
          <input name="elevation_gain" placeholder="2,400 m"></label>

        <label class="field"><span class="field-label">Season</span>
          <input name="season" placeholder="June – October"></label>

        <label class="field"><span class="field-label">Season starts</span>
          <input name="season_from" placeholder="06-01" pattern="\d{2}-\d{2}">
          <span class="field-hint">MM-DD — used by the date filter</span></label>

        <label class="field"><span class="field-label">Season ends</span>
          <input name="season_to" placeholder="10-31" pattern="\d{2}-\d{2}">
          <span class="field-hint">Winter seasons may wrap, e.g. 12-01 → 04-15</span></label>

        <label class="field"><span class="field-label">Languages</span>
          <input name="languages" placeholder="EN · GE · RU"></label>

        <label class="field"><span class="field-label">Accommodation</span>
          <input name="stay" placeholder="Guesthouses"></label>

        <label class="field"><span class="field-label">Badge</span>
          <select name="badge">
            <option value="">None</option>
            <option value="top">TOP</option>
            <option value="new">NEW</option>
          </select></label>

        <label class="field"><span class="field-label">Departure point</span>
          <input name="departure_point" placeholder="Tbilisi, Liberty Square"></label>

        <label class="field"><span class="field-label">Departure time</span>
          <input name="departure_time" placeholder="07:00"></label>

        <label class="field"><span class="field-label">Return</span>
          <input name="return_info" placeholder="Day 4, ~21:00 Tbilisi"></label>

        <label class="field"><span class="field-label">Transport</span>
          <input name="transport" placeholder="Minibus + 4x4"></label>

        <label class="field"><span class="field-label">Group size</span>
          <input name="group_size" placeholder="6 – 12 people"></label>

        <label class="field"><span class="field-label">Walking per day</span>
          <input name="walking_per_day" placeholder="5 – 7 hours"></label>
      </div>

      <label class="field"><span class="field-label">Summary</span>
        <textarea name="summary" rows="3" placeholder="What the trip is, in a couple of sentences."></textarea></label>

      <label class="check">
        <input type="checkbox" name="published" checked>
        <span>Published (visible on the site)</span>
      </label>

      <div class="admin-actions">
        <button class="auth-btn" type="submit" id="saveBtn">Add tour</button>
        <button class="auth-btn google" type="button" id="cancelEdit" hidden>Cancel edit</button>
      </div>

      <p class="form-note" id="adminNote" hidden></p>
    </form>
  </section>

  <!-- ---------- existing tours ---------- -->
  <section class="detail-block">
    <h2>Existing tours</h2>
    <div id="adminList"><p class="form-note">Loading…</p></div>
  </section>
</main>

<!-- shown when you are not signed in as an admin -->
<main class="auth-page" id="adminDenied" hidden>
  <div class="auth-card">
    <a class="auth-logo" href="index.html">
      <img src="assets/torito-logo.png" alt=""><span>TORITO</span>
    </a>
    <h1>Admins only</h1>
    <p class="form-note" id="deniedNote">Checking your account…</p>
    <p class="auth-foot"><a class="auth-link" href="login.html">Sign in</a> · <a class="auth-link" href="index.html">Back to site</a></p>
  </div>
</main>

<script src="script.js"></script>
<script type="module" src="js/session.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
