<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password — Torito</title>
<link rel="icon" href="assets/torito-logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://zwmmgrrrryxaulrcuudy.supabase.co" crossorigin>
<script>
  document.documentElement.classList.add('js');
  // Supabase strips the recovery token from the URL as soon as its module
  // loads, and module imports run before any of ours — so note it here first.
  window.__recoveryLink = location.hash.includes('type=recovery');
</script>
</head>
<body class="auth-body">

<main class="auth-page">
  <div class="auth-card">

    <a class="auth-logo" href="index.html">
      <img src="assets/torito-logo.png" alt="Torito — Georgian Ascent Tours">
      <span>TORITO</span>
    </a>

    <h1 id="resetHeading">Set a new password</h1>
    <p class="form-note" id="resetIntro" hidden></p>

    <!-- shown when you arrived without a recovery link and are not signed in -->
    <form class="auth-form" id="requestForm" novalidate hidden>
      <label class="field">
        <span class="field-label">Email address</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <button class="auth-btn" type="submit">Email me a reset link</button>

      <p class="form-note" id="requestNote" hidden></p>
    </form>

    <!-- shown after a recovery link, or when already signed in -->
    <form class="auth-form" id="updateForm" novalidate hidden>
      <label class="field">
        <span class="field-label">New password</span>
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
        <span class="field-hint">At least 8 characters. Use a password manager if you can.</span>
      </label>

      <label class="field">
        <span class="field-label">Confirm new password</span>
        <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
      </label>

      <button class="auth-btn" type="submit">Save new password</button>

      <p class="form-note" id="updateNote" hidden></p>
    </form>

    <p class="auth-foot"><a class="auth-link" href="login.html">Back to sign in</a></p>
  </div>
</main>

<script type="module" src="js/password.js"></script>
</body>
</html>
