    <path d="M690 768 h20 l6 44 h-32 z"/>
    <path d="M694 812 l-6 44 h10 l8 -40 z"/><path d="M706 812 l8 44 h10 l-8 -44 z"/>
    <rect x="712" y="762" width="18" height="26" rx="5" fill="#2f7264"/>
    <circle cx="762" cy="742" r="13"/>
    <path d="M752 758 h20 l6 46 h-32 z"/>
    <path d="M756 804 l-6 46 h10 l8 -42 z"/><path d="M768 804 l8 46 h10 l-8 -46 z"/>
    <rect x="736" y="752" width="18" height="26" rx="5" fill="#2f7264"/>
