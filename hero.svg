<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb9d6"/>
      <stop offset="55%" stop-color="#a9dbe8"/>
      <stop offset="100%" stop-color="#dcf2ea"/>
    </linearGradient>
    <linearGradient id="hfar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec8dd"/><stop offset="100%" stop-color="#b6dded"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#hsky)"/>
  <circle cx="1280" cy="180" r="70" fill="#fff" opacity=".55"/>
